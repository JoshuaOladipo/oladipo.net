<!doctype html>
<html lang="{{ site.Language.LanguageCode | default "en" }}">
<head>
  {{ partial "head.html" . }}
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <div class="container header-inner">
      <a class="site-name" href="{{ site.Home.RelPermalink }}">{{ site.Title }}</a>
      <nav aria-label="Main navigation">
        <ul class="nav-list">
          {{ range site.Menus.main }}
          <li><a href="{{ .URL }}"{{ if $.IsMenuCurrent "main" . }} aria-current="page"{{ end }}>{{ .Name }}</a></li>
          {{ end }}
        </ul>
      </nav>
    </div>
  </header>
  <main id="main" class="container">{{ block "main" . }}{{ end }}</main>
  <footer class="site-footer">
    <div class="container footer-inner">
      <p>{{ site.Copyright }}</p>
      <nav aria-label="Footer navigation"><ul class="footer-links"><li><a href="{{ "index.xml" | relURL }}">RSS feed</a></li>{{ range site.Params.social }}<li><a href="{{ .url }}">{{ .name }}</a></li>{{ end }}</ul></nav>
    </div>
  </footer>
</body>
</html>
